#####################################################################
#  Kobra 2 Neo macros  (Klipper + OctoPrint/OctoKlipper)
#
#  Prints are streamed by OctoPrint, so OctoPrint's GCODE scripts
#  (Settings > GCODE Scripts) must call these macros:
#     After print job is paused     ->  PAUSE
#     Before print job is resumed   ->  RESUME
#     After print job is cancelled  ->  CANCEL_PRINT
#  PAUSE / RESUME / CANCEL_PRINT are safe to call twice, so it does not
#  matter whether the pause comes from OctoPrint, the slicer (PAUSE/M600),
#  the console or the knob.
#
#  Tune behaviour in _PRINTER_SETTINGS below rather than in the macros.
#####################################################################

[pause_resume]
recover_velocity: 100            # mm/s used to return to the print on RESUME

[display_status]                 # M73 / M117 from the slicer and OctoPrint

[gcode_macro _PRINTER_SETTINGS]
description: Tunable values used by the macros in this file
# --- pause / park ---
variable_park_x: -5.0            # off the left edge of the bed (X min is -14)
variable_park_y: 200.0           # bed pushed forward for access
variable_park_lift: 10.0         # mm lifted above the print on PAUSE
variable_pause_retract: 2.0      # mm retracted on PAUSE
variable_resume_prime: 2.0       # mm re-extruded on RESUME (match pause_retract)
variable_pause_idle_timeout: 3600  # s a paused print is held before the hotend is switched off
# --- filament change (M600) ---
variable_m600_z_min: 50.0        # park at least this high for a filament swap
variable_m600_unload: False      # True = unload filament automatically on M600
variable_m600_purge: 15.0        # extra mm purged at the park spot on RESUME after M600
# --- load / unload ---
variable_filament_temp: 210      # used when the nozzle is cold and no TEMP= given
variable_load_length: 40.0
variable_load_speed: 5.0         # mm/s
variable_unload_length: 100.0
variable_unload_speed: 30.0      # mm/s
variable_load_purge: 20.0        # mm purged after loading (and PURGE_FILAMENT default)
# --- purge tower (used when NOT printing) ---
variable_tower_x: 0.0            # tower at the front-left corner
variable_tower_y: 0.0
variable_tower_z: 10.0           # purge from this height onto the tower
# --- rear nozzle wiper ---
variable_wipe_y: 240.0
variable_wipe_x_start: 95.0
variable_wipe_x_end: 70.0
variable_wipe_passes: 4
# --- cancel / end ---
variable_cancel_retract: 5.0
variable_end_retract: 2.0
variable_end_park_x: 20.0
variable_end_park_y: 200.0       # present the print
variable_end_lift: 10.0
# --- start ---
variable_start_mesh: 'adaptive'  # 'adaptive' = probe print area, 'saved' = load profile "default", 'none'
variable_probe_nozzle_temp: 150  # nozzle temp while homing/meshing (no oozing)
variable_purge_prime: 5.0        # mm extruded before the purge line
variable_purge_length: 25.0      # mm extruded along the purge line
# --- speeds ---
variable_retract_speed: 35.0     # mm/s
variable_travel_speed: 150.0     # mm/s
variable_z_speed: 8.0            # mm/s (max_z_velocity)
gcode:

#####################################################################
#  Print start / end
#####################################################################

[gcode_macro START_PRINT]
description: Slicer start: START_PRINT EXTRUDER_TEMP=<t> BED_TEMP=<t> [MESH=saved|adaptive|none]
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(200)|float %}
  {% set MESH = params.MESH|default(s.start_mesh)|lower %}
  {% set PROBE_TEMP = [s.probe_nozzle_temp, EXTRUDER_TEMP]|min %}

  CLEAR_PAUSE
  SET_GCODE_VARIABLE MACRO=CANCEL_PRINT VARIABLE=cancelled VALUE=False
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=m600 VALUE=False
  SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=reason VALUE="'none'"
  BED_MESH_CLEAR

  # Heat bed fully, nozzle only warm so it does not ooze while probing
  M140 S{BED_TEMP}
  M104 S{PROBE_TEMP}
  M190 S{BED_TEMP}

  G90
  G28

  {% if MESH == 'adaptive' %}
    BED_MESH_CALIBRATE ADAPTIVE=1
  {% elif MESH == 'saved' %}
    BED_MESH_PROFILE LOAD="default"
  {% endif %}

  # Wait at the purge line start for the final nozzle temp
  G1 X50 Y0 Z3 F{s.travel_speed * 60}
  M109 S{EXTRUDER_TEMP}
  _PURGE_LINE

[gcode_macro _PURGE_LINE]
description: Helper: prime line along the front edge
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  SAVE_GCODE_STATE NAME=_purge
  G90
  M83
  G1 X70 Y-2 Z0.6 F2400
  G1 E{s.purge_prime} F600
  G1 X130 E{s.purge_length} F900
  G1 X140 F3000                  ; wipe
  G1 Z1 F600
  G92 E0
  RESTORE_GCODE_STATE NAME=_purge

[gcode_macro PRINT_END]
description: Slicer end: retract, present the print, heaters/motors off
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  _EXTRUDE LENGTH=-{s.end_retract} SPEED={s.retract_speed}
  TURN_OFF_HEATERS
  M106 S0
  _PARK X={s.end_park_x} Y={s.end_park_y} LIFT={s.end_lift}
  M400
  BED_MESH_CLEAR
  SET_PAUSE_NEXT_LAYER ENABLE=0
  SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
  _RESTORE_IDLE_TIMEOUT
  M84
  RESPOND MSG="Print finished"

#####################################################################
#  Pause / resume / cancel
#####################################################################

[gcode_macro PAUSE]
description: Pause: retract, lift and park. PAUSE [X=] [Y=] [Z_MIN=] [PARK=0 lifts only] [REASON=]
rename_existing: PAUSE_BASE
variable_extruder_temp: 0
variable_m600: False
variable_reason: 'none'          # manual / layer / m600 - read by the OctoPrint dashboard pop-up
variable_layer_trigger: False    # set by SET_PRINT_STATS_INFO when pause-at-layer fires
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% if printer.pause_resume.is_paused %}
    RESPOND MSG="Already paused"
  {% else %}
    {% set x = params.X|default(s.park_x) %}
    {% set y = params.Y|default(s.park_y) %}
    {% set z_min = params.Z_MIN|default(0) %}
    {% set park_xy = params.PARK|default(1)|int %}
    {% set reason = params.REASON|default('layer' if layer_trigger else 'manual')|lower %}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=reason VALUE="'{reason}'"
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=layer_trigger VALUE=False
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=extruder_temp VALUE={printer.extruder.target}
    SET_IDLE_TIMEOUT TIMEOUT={s.pause_idle_timeout}
    PAUSE_BASE
    _EXTRUDE LENGTH=-{s.pause_retract} SPEED={s.retract_speed}
    _PARK X={x} Y={y} LIFT={s.park_lift} Z_MIN={z_min} XY={park_xy}
    RESPOND MSG="Paused. Nozzle held at {printer.extruder.target|int}C for {(s.pause_idle_timeout / 60)|int} min."
  {% endif %}

[gcode_macro RESUME]
description: Resume: reheat if needed, prime and return. RESUME [KEEP_OFFSETS=1] [VELOCITY=]
rename_existing: RESUME_BASE
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% set p = printer['gcode_macro PAUSE'] %}
  {% set velocity = params.VELOCITY|default(printer.configfile.settings.pause_resume.recover_velocity) %}
  {% set keep_offsets = params.KEEP_OFFSETS|default(0)|int %}
  {% set origin = printer.gcode_move.homing_origin %}
  {% if not printer.pause_resume.is_paused %}
    RESPOND MSG="Not paused - nothing to resume"
  {% elif "xyz" not in printer.toolhead.homed_axes %}
    RESPOND TYPE=error MSG="Axes are no longer homed (motors were switched off) - this print cannot be resumed safely. Use CANCEL_PRINT."
  {% else %}
    {% if p.extruder_temp > 0 %}
      {% if printer.extruder.target < p.extruder_temp %}
        RESPOND MSG="Reheating nozzle to {p.extruder_temp|int}C"
      {% endif %}
      M109 S{p.extruder_temp}
    {% endif %}
    {% if p.m600 %}
      _EXTRUDE LENGTH={s.m600_purge} SPEED=5
      G4 P1000
    {% endif %}
    _EXTRUDE LENGTH={s.resume_prime} SPEED={s.retract_speed}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=m600 VALUE=False
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=reason VALUE="'none'"
    _RESTORE_IDLE_TIMEOUT
    RESUME_BASE VELOCITY={velocity}
    {% if keep_offsets %}
      # re-apply offsets changed while paused (RESUME_BASE restores the old ones)
      SET_GCODE_OFFSET X={origin.x} Y={origin.y} Z={origin.z} MOVE=1
    {% endif %}
  {% endif %}

[gcode_macro M600]
description: Filament change: park high, (optionally unload), wait for RESUME
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% if printer.pause_resume.is_paused %}
    RESPOND MSG="Already paused"
  {% else %}
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=m600 VALUE=True
    PAUSE Z_MIN={s.m600_z_min} REASON=m600
    {% if s.m600_unload %}
      UNLOAD_FILAMENT
    {% endif %}
    RESPOND MSG="Filament change: UNLOAD_FILAMENT, insert new filament, LOAD_FILAMENT, then RESUME"
  {% endif %}

[gcode_macro CANCEL_PRINT]
description: Cancel: retract, heaters/fan off, park, clear pause state
rename_existing: CANCEL_PRINT_BASE
variable_cancelled: False
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% if cancelled and not printer.pause_resume.is_paused %}
    RESPOND MSG="Cancel already done"
  {% else %}
    SET_GCODE_VARIABLE MACRO=CANCEL_PRINT VARIABLE=cancelled VALUE=True
    UPDATE_DELAYED_GCODE ID=_RESET_CANCEL DURATION=30
    _EXTRUDE LENGTH=-{s.cancel_retract} SPEED={s.retract_speed}
    TURN_OFF_HEATERS
    M106 S0
    {% if not printer.pause_resume.is_paused %}
      _PARK X={s.end_park_x} Y={s.end_park_y} LIFT={s.end_lift}
    {% endif %}
    SET_PAUSE_NEXT_LAYER ENABLE=0
    SET_PAUSE_AT_LAYER ENABLE=0 LAYER=0
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=m600 VALUE=False
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=reason VALUE="'none'"
    BED_MESH_CLEAR
    _RESTORE_IDLE_TIMEOUT
    CANCEL_PRINT_BASE
    RESPOND MSG="Print cancelled"
  {% endif %}

# The knob, OctoPrint and on_error can all fire CANCEL_PRINT for one cancel;
# the flag makes the extra calls no-ops for 30 s.
[delayed_gcode _RESET_CANCEL]
gcode:
  SET_GCODE_VARIABLE MACRO=CANCEL_PRINT VARIABLE=cancelled VALUE=False

#####################################################################
#  Pause at layer (needs SET_PRINT_STATS_INFO in the slicer's layer
#  change gcode - see notes)
#####################################################################

# Usage: SET_PAUSE_NEXT_LAYER [ENABLE=[0 | 1]] [MACRO=<name>]
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause if the next layer is reached
gcode:
  {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set ENABLE = params.ENABLE | default(1)|int != 0 %}
  {% set MACRO = params.MACRO | default(pause_next_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

# Usage: SET_PAUSE_AT_LAYER [ENABLE=[0 | 1]] [LAYER=<number>] [MACRO=<name>]
[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable/disable a pause if a given layer number is reached
gcode:
  {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set ENABLE = params.ENABLE | int != 0 if params.ENABLE is defined
             else params.LAYER is defined %}
  {% set LAYER = params.LAYER | default(pause_at_layer.layer) | int %}
  {% set MACRO = params.MACRO | default(pause_at_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"

# Usage: SET_PRINT_STATS_INFO [TOTAL_LAYER=<total_layer_count>] [CURRENT_LAYER= <current_layer>]
[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
description: Overwrite, to get pause_next_layer and pause_at_layer feature
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer  : { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
  {% if pause_next_layer.enable and params.CURRENT_LAYER is defined %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=layer_trigger VALUE=True
    {pause_next_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER | int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=layer_trigger VALUE=True
    {pause_at_layer.call} ; execute the given gcode to pause, should be either M600 or PAUSE
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}

#####################################################################
#  Helpers
#####################################################################

[gcode_macro _EXTRUDE]
description: Helper: relative extrude (negative = retract) only if the nozzle is hot. LENGTH= SPEED=mm/s
gcode:
  {% set length = params.LENGTH|default(0)|float %}
  {% set speed = params.SPEED|default(35)|float %}
  {% if length != 0 %}
    {% if printer.extruder.can_extrude %}
      SAVE_GCODE_STATE NAME=_extrude
      M83
      G1 E{length} F{speed * 60}
      RESTORE_GCODE_STATE NAME=_extrude
    {% else %}
      RESPOND MSG="Nozzle too cold - skipped extruding {length}mm"
    {% endif %}
  {% endif %}

[gcode_macro _PARK]
description: Helper: lift by LIFT (at least to Z_MIN, never past Z max), then move to X/Y unless XY=0
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% if "xyz" not in printer.toolhead.homed_axes %}
    RESPOND MSG="Not homed - skipping park move"
  {% else %}
    {% set origin = printer.gcode_move.homing_origin %}
    {% set pos = printer.gcode_move.gcode_position %}
    {% set amin = printer.toolhead.axis_minimum %}
    {% set amax = printer.toolhead.axis_maximum %}
    {% set lift = params.LIFT|default(s.park_lift)|float %}
    {% set z_min = params.Z_MIN|default(0)|float %}
    {% set z = [[pos.z + lift, z_min]|max, amax.z - origin.z - 2]|min %}
    {% set x = [[params.X|default(s.park_x)|float, amin.x - origin.x]|max, amax.x - origin.x]|min %}
    {% set y = [[params.Y|default(s.park_y)|float, amin.y - origin.y]|max, amax.y - origin.y]|min %}
    SAVE_GCODE_STATE NAME=_park
    G90
    {% if z > pos.z %}
      G1 Z{z} F{s.z_speed * 60}
    {% endif %}
    {% if params.XY|default(1)|int %}
      G1 X{x} Y{y} F{s.travel_speed * 60}
    {% endif %}
    RESTORE_GCODE_STATE NAME=_park
  {% endif %}

[gcode_macro _RESTORE_IDLE_TIMEOUT]
description: Helper: put idle_timeout back to the printer.cfg value
gcode:
  SET_IDLE_TIMEOUT TIMEOUT={printer.configfile.settings.idle_timeout.timeout}

[gcode_macro PARK]
description: Park the toolhead. PARK [X=] [Y=] [LIFT=] [Z_MIN=]
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  _PARK X={params.X|default(s.park_x)} Y={params.Y|default(s.park_y)} LIFT={params.LIFT|default(s.park_lift)} Z_MIN={params.Z_MIN|default(0)}

#####################################################################
#  Filament
#####################################################################

[gcode_macro _HEAT_FOR_FILAMENT]
description: Helper: heat for filament moves (paused: the print's temp; else current target or filament_temp)
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% set p = printer['gcode_macro PAUSE'] %}
  {% set min_temp = printer.configfile.settings.extruder.min_extrude_temp %}
  {% set temp = params.TEMP|default(0)|float %}
  {% if temp == 0 %}
    {% if printer.pause_resume.is_paused and p.extruder_temp >= min_temp %}
      {% set temp = p.extruder_temp %}
    {% elif printer.extruder.target >= min_temp %}
      {% set temp = printer.extruder.target %}
    {% else %}
      {% set temp = s.filament_temp %}
    {% endif %}
  {% endif %}
  RESPOND MSG="Heating nozzle to {temp|int}C"
  M109 S{temp}

[gcode_macro _ENSURE_HOMED]
description: Helper: home all axes if not homed
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}

[gcode_macro _GOTO_TOWER]
description: Helper: lift to tower_z, then move over the purge tower
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% set pos = printer.gcode_move.gcode_position %}
  SAVE_GCODE_STATE NAME=_tower
  G90
  {% if pos.z < s.tower_z %}
    G1 Z{s.tower_z} F{s.z_speed * 60}
  {% endif %}
  G1 X{s.tower_x} Y{s.tower_y} F{s.travel_speed * 60}
  G1 Z{s.tower_z} F{s.z_speed * 60}
  M400
  RESTORE_GCODE_STATE NAME=_tower

[gcode_macro _WIPE]
description: Helper: wipe the hot nozzle on the rear wiper and lift (needs homed axes)
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% set pos = printer.gcode_move.gcode_position %}
  SAVE_GCODE_STATE NAME=_wipe
  G90
  {% if pos.z < 5 %}
    G1 Z5 F{s.z_speed * 60}
  {% endif %}
  G1 X{s.wipe_x_start} Y{s.wipe_y} F{s.travel_speed * 60}
  G1 Z0 F{s.z_speed * 60}
  {% for i in range(s.wipe_passes|int) %}
    G1 X{s.wipe_x_end} F6000
    G1 X{s.wipe_x_start} F6000
  {% endfor %}
  G1 Z5 F{s.z_speed * 60}
  RESTORE_GCODE_STATE NAME=_wipe

[gcode_macro _FILAMENT_MOVE]
description: Helper: relative extruder move with save/restore. E= SPEED=mm/s
gcode:
  SAVE_GCODE_STATE NAME=_fmove
  M83
  G1 E{params.E|float} F{params.SPEED|default(5)|float * 60}
  RESTORE_GCODE_STATE NAME=_fmove

[gcode_macro LOAD_FILAMENT]
description: Load. Idle: purge over the X0 tower then wipe. Paused: load at the park spot. [TEMP=] [LENGTH=] [PURGE=]
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% set length = params.LENGTH|default(s.load_length)|float %}
  {% set purge = params.PURGE|default(s.load_purge)|float %}
  {% if printer.pause_resume.is_paused %}
    _HEAT_FOR_FILAMENT TEMP={params.TEMP|default(0)}
    _FILAMENT_MOVE E={length + purge} SPEED={s.load_speed}
    _FILAMENT_MOVE E=-1 SPEED=30
    # new filament already purged - no extra M600 purge needed on RESUME
    SET_GCODE_VARIABLE MACRO=PAUSE VARIABLE=m600 VALUE=False
    RESPOND MSG="Filament loaded at the park spot - RESUME when ready"
  {% else %}
    _ENSURE_HOMED
    _GOTO_TOWER
    _HEAT_FOR_FILAMENT TEMP={params.TEMP|default(0)}
    _FILAMENT_MOVE E={length + purge} SPEED={s.load_speed}
    _FILAMENT_MOVE E=-1 SPEED=30
    G4 P1500
    _WIPE
    RESPOND MSG="Filament loaded, purged on the tower and nozzle wiped"
  {% endif %}

[gcode_macro UNLOAD_FILAMENT]
description: Unload. Idle: over the X0 tower. Paused: in place at the park spot. [TEMP=] [LENGTH=]
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% set length = params.LENGTH|default(s.unload_length)|float %}
  {% if not printer.pause_resume.is_paused %}
    _ENSURE_HOMED
    _GOTO_TOWER
  {% endif %}
  _HEAT_FOR_FILAMENT TEMP={params.TEMP|default(0)}
  _FILAMENT_MOVE E=10 SPEED=5          ; soften the tip
  _FILAMENT_MOVE E=-15 SPEED=50        ; snap back to form a clean tip
  G4 P2000
  _FILAMENT_MOVE E=-{length - 15} SPEED={s.unload_speed}
  RESPOND MSG="Filament unloaded"

[gcode_macro PURGE_FILAMENT]
description: Purge. Idle: over the X0 tower then wipe. Paused: at the park spot. [LENGTH=20] [TEMP=]
gcode:
  {% set s = printer['gcode_macro _PRINTER_SETTINGS'] %}
  {% set length = params.LENGTH|default(s.load_purge)|float %}
  {% if printer.pause_resume.is_paused %}
    _HEAT_FOR_FILAMENT TEMP={params.TEMP|default(0)}
    _FILAMENT_MOVE E={length} SPEED=5
    _FILAMENT_MOVE E=-1 SPEED=30
  {% else %}
    _ENSURE_HOMED
    _GOTO_TOWER
    _HEAT_FOR_FILAMENT TEMP={params.TEMP|default(0)}
    _FILAMENT_MOVE E={length} SPEED=5
    _FILAMENT_MOVE E=-1 SPEED=30
    G4 P1500
    _WIPE
  {% endif %}
  RESPOND MSG="Purged {length|int} mm"

#####################################################################
#  Heating / utilities
#####################################################################

[gcode_macro PREHEAT]
description: Heat without waiting. PREHEAT [MATERIAL=PLA|PETG|ABS|TPU]
gcode:
  {% set presets = {'PLA': [210, 60], 'PETG': [240, 75], 'ABS': [250, 100], 'TPU': [225, 50]} %}
  {% set m = params.MATERIAL|default('PLA')|upper %}
  {% if m in presets %}
    M104 S{presets[m][0]}
    M140 S{presets[m][1]}
    RESPOND MSG="Preheating for {m}: nozzle {presets[m][0]}C, bed {presets[m][1]}C"
  {% else %}
    RESPOND TYPE=error MSG="Unknown material {m} (use PLA, PETG, ABS or TPU)"
  {% endif %}

[gcode_macro COOLDOWN]
description: Heaters and part fan off
gcode:
  TURN_OFF_HEATERS
  M106 S0

[gcode_macro CLEAN_NOZZLE]
description: Heat, wipe on the rear wiper, cool down and re-home. CLEAN_NOZZLE [TEMP=220]
gcode:
  {% set temp = params.TEMP|default(220)|float %}
  {% if printer.pause_resume.is_paused %}
    RESPOND TYPE=error MSG="CLEAN_NOZZLE is not allowed while paused (it re-homes)"
  {% else %}
    _ENSURE_HOMED
    G90
    G1 Z10 F{8 * 60}
    M109 S{temp}
    _WIPE
    G90
    G1 Z0 F{8 * 60}
    M106 S255
    G1 X80 F6000
    M109 S150
    M106 S0
    M104 S0
    G1 Z10 F{8 * 60}
    G28
  {% endif %}

[gcode_macro MESH_CALIBRATE]
description: Heat bed, home, probe a full bed mesh and save it. MESH_CALIBRATE [BED_TEMP=60]
gcode:
  {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
  M104 S0
  M190 S{BED_TEMP}
  G28
  BED_MESH_CALIBRATE
  SAVE_VARIABLE VARIABLE=mesh_bed_temp VALUE={BED_TEMP}
  RESPOND PREFIX="info" MSG="Bed mesh done - saving (Klipper will restart)"
  SAVE_CONFIG

[gcode_macro PID_HOTEND]
description: PID tune the hotend. PID_HOTEND [TEMP=220]  (then SAVE_CONFIG)
gcode:
  M106 S255
  PID_CALIBRATE HEATER=extruder TARGET={params.TEMP|default(220)}
  M106 S0
  RESPOND MSG="Run SAVE_CONFIG to keep the new values"

[gcode_macro PID_BED]
description: PID tune the bed. PID_BED [TEMP=60]  (then SAVE_CONFIG)
gcode:
  PID_CALIBRATE HEATER=heater_bed TARGET={params.TEMP|default(60)}
  RESPOND MSG="Run SAVE_CONFIG to keep the new values"

[gcode_macro DRY_FILAMENT]
description: Hold the bed hot to dry filament. DRY_FILAMENT [TEMP=60] [HOURS=3]
gcode:
  {% set temp = params.TEMP|default(60)|float %}
  {% set hours = params.HOURS|default(3)|float %}
  M140 S{temp}
  SET_IDLE_TIMEOUT TIMEOUT={(hours * 3600 + 600)|int}
  UPDATE_DELAYED_GCODE ID=_DRY_FILAMENT_DONE DURATION={(hours * 3600)|int}
  RESPOND MSG="Drying at {temp|int}C for {hours} h. STOP_DRYING to end early."

[gcode_macro STOP_DRYING]
description: End DRY_FILAMENT early
gcode:
  UPDATE_DELAYED_GCODE ID=_DRY_FILAMENT_DONE DURATION=0
  M140 S0
  _RESTORE_IDLE_TIMEOUT
  RESPOND MSG="Drying stopped"

[delayed_gcode _DRY_FILAMENT_DONE]
gcode:
  M140 S0
  _RESTORE_IDLE_TIMEOUT
  RESPOND MSG="Filament drying finished"

#####################################################################
#  Z-button probe offset helper (unchanged)
#####################################################################

[gcode_macro Z_ENDSTOP_HIT]
gcode:
  {% set Z_ENDSTOP_HIT = printer.save_variables.variables.z_endstop_hit | default(0) | float | round(3) %}
  RESPOND TYPE=command MSG="Reset z_endstop_hit from {Z_ENDSTOP_HIT} to 0.0"
  SAVE_VARIABLE VARIABLE=z_endstop_hit VALUE=0
  G90
  G1 X58.10 Y238.80 Z5 F8000
  # TODO -> Add retraction and wipe, make sure it is in center!
  M400
  G1 X58.10 Y238.80 Z3 F500
  M400
  G91
  {% set z_count = 500 %}
  {% for cz in range(z_count) %}
    _MOVE_Z_DOWN
  {% endfor %}

[gcode_macro _MOVE_Z_DOWN]
gcode:
  {% if printer.save_variables.variables.z_endstop_hit == 0 %}
    G1 Z-0.01 F50
    M400
    _CHECK_Z_HIT
  {% endif %}

[gcode_macro _CHECK_Z_HIT]
variable_z_end: 0
gcode:
    {% set Z_POSITION = printer.toolhead.position.z | default(0) | float | round(3) %}
    {% set Z_PROBE_OFFSET = printer.configfile.settings.probe.z_offset | default(0) | float | round(3) %}
    {% set Z_PRINTBED_OFFSET = printer.save_variables.variables.z_printbed_offset | default(0.4) | float | round(3) %}

    {% if printer['gcode_button pa0'].state == "PRESSED" %}
        RESPOND TYPE=command MSG="Z-end button hit at {Z_POSITION}"
        SAVE_VARIABLE VARIABLE=z_endstop_hit VALUE={Z_POSITION}
        {% set CALCULATED_Z_PROBE_OFFSET = Z_PROBE_OFFSET + Z_POSITION * -1 - Z_PRINTBED_OFFSET %}
        SAVE_VARIABLE VARIABLE=z_calculate_probe VALUE={CALCULATED_Z_PROBE_OFFSET}
        RESPOND TYPE=command MSG="Manually modify the probe z-offset in the printer.cfg to {CALCULATED_Z_PROBE_OFFSET}"
    {% endif %}
